<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Catatan Keuangan</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- DASHBOARD -->

<div id="dashboardPage"
class="page active">

<h1>💰 Catatan Keuangan</h1>

<div class="card">

<h3>Pengeluaran Hari Ini</h3>

<div
id="totalHariIni"
class="nominal-besar">

Rp 0

</div>

</div>

<div class="card">

<h3>Pengeluaran Bulan Ini</h3>

<div
id="totalBulanIni"
class="nominal-besar">

Rp 0

</div>

</div>

<div class="card">

<h3>Jumlah Transaksi Hari Ini</h3>

<div
id="jumlahTransaksi"
class="nominal-besar">

0

</div>

</div>

<div class="card">

<h3>Kategori Terbesar Bulan Ini</h3>

<div
id="kategoriTerbesar"
class="nominal-besar">

-

</div>

</div>

</div>

<!-- TAMBAH -->

<div
id="tambahPage"
class="page">

<h1>➕ Tambah Pengeluaran</h1>

<div class="card">

<input
type="date"
id="tanggal">

<select id="kategori">

<option>Makan</option>
<option>BBM</option>
<option>Belanja</option>
<option>Rokok</option>
<option>Lainnya</option>

</select>

<input
type="number"
id="nominal"
placeholder="Nominal">

<input
type="text"
id="catatan"
placeholder="Catatan">

<button
onclick="tambahPengeluaran()">

Simpan

</button>

</div>

</div>

<!-- RIWAYAT -->

<div
id="riwayatPage"
class="page">

<h1>📋 Riwayat</h1>

<div class="card">

<input
type="date"
id="tanggalAwal">

<label>Tanggal Awal</label>

<input
type="date"
id="tanggalAwal">

<label>Tanggal Akhir</label>

<input
type="date"
id="tanggalAkhir">

<button
onclick="filterRiwayatPeriode()">

Tampilkan

</button>

<div id="ringkasanPeriode"></div>

<div
id="ringkasanPeriode">

</div>

</div>

<div
id="hasilRiwayat">

</div>

</div>

<!-- SETELAN -->

<div
id="setelanPage"
class="page">

<h1>⚙️ Setelan</h1>

<div class="card">

<h3>Versi Aplikasi</h3>

<p>v2.0</p>

<hr>

<h3>Penyimpanan</h3>

<p>Local Storage Browser</p>

<hr>
  
<button
onclick="exportExcel()">

📊 Export Excel

</button>

<br><br>
  
<button
onclick="hapusSemuaData()"
class="btn-merah">

Hapus Semua Data

</button>

</div>

</div>

<!-- NAVBAR -->

<div class="bottom-nav">

<button
onclick="showPage('dashboardPage')">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</button>

<button
onclick="showPage('tambahPage')">

<i class="fa-solid fa-plus"></i>

<span>Tambah</span>

</button>

<button
onclick="showPage('riwayatPage')">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>Riwayat</span>

</button>

<button
onclick="showPage('setelanPage')">

<i class="fa-solid fa-gear"></i>

<span>Setelan</span>

</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>

</body>
</html>
