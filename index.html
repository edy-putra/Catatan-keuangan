<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catatan Keuangan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:15px;
}

h1{
margin-bottom:15px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
margin-bottom:15px;
}

input,
select,
button{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:10px;
}

button{
background:#1e88e5;
color:white;
border:none;
font-weight:bold;
}

.total{
font-size:28px;
font-weight:bold;
color:#1e88e5;
}

.item{
padding:10px 0;
border-bottom:1px solid #eee;
}

.hapus{
background:#e53935;
margin-top:8px;
}

.ringkasan-item{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<h1>💰 Catatan Keuangan</h1>

<div class="card">

<h2>Total Pengeluaran</h2>

<div id="total" class="total">
Rp 0
</div>

</div>

<div class="card">

<h2>Tambah Pengeluaran</h2>

<input type="date" id="tanggal">

<select id="kategori">
<option>Makan</option>
<option>BBM</option>
<option>Belanja</option>
<option>Rokok</option>
<option>Lainnya</option>
</select>

<input
type="number"
id="nominal"
placeholder="Nominal">

<input
type="text"
id="catatan"
placeholder="Catatan">

<button onclick="tambahPengeluaran()">
Simpan
</button>

</div>

<div class="card">

<h2>Ringkasan Kategori</h2>

<input
type="date"
id="tanggalRingkasan">

<button onclick="buatRingkasan()">
Lihat Ringkasan
</button>

<div id="hasilRingkasan">

Pilih tanggal dahulu

</div>

</div>

<div class="card">

<h2>Riwayat Pengeluaran</h2>

<input
type="date"
id="filterTanggal">

<button onclick="filterRiwayat()">
Tampilkan
</button>

<div id="hasilRiwayat">

Belum ada data

</div>

</div>

<script>

let data =
JSON.parse(
localStorage.getItem("pengeluaran")
) || [];

function simpanData(){

localStorage.setItem(
"pengeluaran",
JSON.stringify(data)
);

}

function tambahPengeluaran(){

const tanggal =
document.getElementById("tanggal").value;

const kategori =
document.getElementById("kategori").value;

const nominal =
Number(
document.getElementById("nominal").value
);

const catatan =
document.getElementById("catatan").value;

if(!tanggal || !nominal){

alert("Lengkapi data");

return;

}

data.push({

id:Date.now(),

tanggal,

kategori,

nominal,

catatan

});

simpanData();

document.getElementById("nominal").value="";
document.getElementById("catatan").value="";

renderTotal();

alert("Data tersimpan");

}

function renderTotal(){

let total = 0;

data.forEach(item=>{

total += item.nominal;

});

document.getElementById("total")
.innerHTML =
"Rp " +
total.toLocaleString("id-ID");

}

function buatRingkasan(){

const tanggal =
document.getElementById(
"tanggalRingkasan"
).value;

const hasil =
data.filter(
item =>
item.tanggal === tanggal
);

let kategori = {};

hasil.forEach(item=>{

if(!kategori[item.kategori]){

kategori[item.kategori]=0;

}

kategori[item.kategori]+=item.nominal;

});

let html =
`<h3>Ringkasan ${tanggal}</h3>`;

let totalHari = 0;

for(let k in kategori){

totalHari += kategori[k];

html += `
<div class="ringkasan-item">

<span>${k}</span>

<span>
Rp ${kategori[k]
.toLocaleString("id-ID")}
</span>

</div>
`;

}

html += `
<br>

<b>
Total :
Rp ${totalHari
.toLocaleString("id-ID")}
</b>
`;

document.getElementById(
"hasilRingkasan"
).innerHTML = html;

}

function filterRiwayat(){

const tanggal =
document.getElementById(
"filterTanggal"
).value;

const hasil =
data.filter(
item =>
item.tanggal === tanggal
);

let html = "";

if(hasil.length===0){

html = "Tidak ada data";

}

hasil.forEach(item=>{

html += `

<div class="item">

<b>${item.kategori}</b>

<br>

${item.catatan}

<br>

Rp ${item.nominal
.toLocaleString("id-ID")}

<br>

${item.tanggal}

<br><br>

<button
class="hapus"
onclick="hapusData(${item.id})">

Hapus

</button>

</div>

`;

});

document.getElementById(
"hasilRiwayat"
).innerHTML = html;

}

function hapusData(id){

if(!confirm("Hapus data?")){

return;

}

data =
data.filter(
item =>
item.id !== id
);

simpanData();

renderTotal();

filterRiwayat();

}

renderTotal();

</script>

</body>
</html>
